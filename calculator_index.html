<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="calculator_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <!-- Permanent Unit Converter Panel (Left) -->
        <div class="converter-panel permanent-panel" id="unit-converter-container">
            <div class="panel-header">
                <h3>Unit Converter</h3>
            </div>
            <div class="converter-content">
                <div class="input-group">
                    <label>Category</label>
                    <select id="converter-category" class="custom-select">
                        <option value="length">Length</option>
                        <option value="volume">Volume</option>
                        <option value="mass">Mass</option>
                    </select>
                </div>

                <div class="conversion-area">
                    <div class="input-group">
                        <input type="number" id="converter-from-value" value="1" class="converter-input">
                        <select id="converter-from-unit" class="custom-select"></select>
                    </div>

                    <div class="swap-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="14" x2="21" y2="3"></line>
                            <polyline points="8 21 3 21 3 16"></polyline>
                            <line x1="20" y1="10" x2="3" y2="21"></line>
                        </svg>
                    </div>

                    <div class="input-group">
                        <input type="number" id="converter-to-value" readonly class="converter-input result-input">
                        <select id="converter-to-unit" class="custom-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Calculator (Center) -->
        <div class="calculator-container">
            <div class="calculator">
                <div class="top-bar">
                    <div class="brand">Advanced Calc</div>
                    <div class="controls">
                        <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-sun">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </button>
                        <button class="icon-btn" id="history-toggle" title="View History">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="display" id="display">0</div>
                <div class="buttons merged-mode">
                    <button class="btn scientific operator" data-action="sin">sin</button>
                    <button class="btn scientific operator" data-action="cos">cos</button>
                    <button class="btn scientific operator" data-action="tan">tan</button>
                    <button class="btn operator" data-action="clear" title="Clear All">C</button>
                    <button class="btn operator" data-action="delete" title="Delete Last">DEL</button>

                    <button class="btn scientific operator" data-action="power">xⁿ</button>
                    <button class="btn scientific operator" data-action="log">log</button>
                    <button class="btn scientific operator" data-action="ln">ln</button>
                    <button class="btn operator" data-action="percent">%</button>
                    <button class="btn operator highlight" data-action="divide">÷</button>

                    <button class="btn scientific operator" data-action="sqrt">√</button>
                    <button class="btn number" data-number="7">7</button>
                    <button class="btn number" data-number="8">8</button>
                    <button class="btn number" data-number="9">9</button>
                    <button class="btn operator highlight" data-action="multiply">×</button>

                    <button class="btn scientific" data-number="pi">π</button>
                    <button class="btn number" data-number="4">4</button>
                    <button class="btn number" data-number="5">5</button>
                    <button class="btn number" data-number="6">6</button>
                    <button class="btn operator highlight" data-action="subtract">-</button>

                    <!-- Spacers to fill the 5-column grid cleanly -->
                    <div class="spacer"></div>
                    <button class="btn number" data-number="1">1</button>
                    <button class="btn number" data-number="2">2</button>
                    <button class="btn number" data-number="3">3</button>
                    <button class="btn operator highlight" data-action="add">+</button>

                    <div class="spacer"></div>
                    <button class="btn number zero" data-number="0">0</button>
                    <button class="btn number" data-number=".">.</button>
                    <button class="btn operator highlight equals" data-action="calculate">=</button>
                </div>
            </div>
        </div>

        <!-- Permanent Currency Converter Panel (Right) -->
        <div class="currency-panel permanent-panel" id="currency-converter-container">
            <div class="panel-header">
                <h3>Currency Exchange</h3>
            </div>
            <div class="converter-content">
                <div class="input-group">
                    <label>Live Rates</label>
                    <div class="api-status-container">
                        <div class="api-status" id="api-status">Fetching rates...</div>
                        <div class="api-source">via exchangerate-api.com</div>
                    </div>
                </div>

                <div class="conversion-area">
                    <div class="input-group">
                        <input type="number" id="currency-from-value" value="1" class="converter-input">
                        <select id="currency-from-unit" class="custom-select">
                            <option value="USD">USD</option>
                        </select>
                    </div>

                    <div class="swap-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="14" x2="21" y2="3"></line>
                            <polyline points="8 21 3 21 3 16"></polyline>
                            <line x1="20" y1="10" x2="3" y2="21"></line>
                        </svg>
                    </div>

                    <div class="input-group">
                        <input type="number" id="currency-to-value" readonly class="converter-input result-input">
                        <select id="currency-to-unit" class="custom-select">
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel (Still Slides out to the right OVER the currency panel) -->
        <div class="side-panel" id="history-container">
            <div class="panel-header">
                <h3>History</h3>
                <button class="icon-btn" id="clear-history" title="Clear History">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="history-list">
                <div class="empty-history">No history yet</div>
            </div>
        </div>
    </div>
    <script src="calculator_script.js"></script>
</body>

</html>
